<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Callaway JROTC Leadership Decision Lab V4.2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">CALLAWAY JROTC <small>4th Battalion • Chargers</small></div>
  <div id="hud" class="hidden">TIME <b id="time">60:00</b> · JUDGMENT <b id="score">3000</b> · CASE <b id="caseNo">1/5</b></div>
</header>

<main>
<section id="start" class="screen active">
  <p class="eyebrow">VERSION 4.2 • LEADERSHIP DECISION LAB</p>
  <h1>THERE IS NO <span>EASY BUTTON.</span></h1>
  <p class="lead">Investigate first. Decide second. Defend your judgment. Choices lock in and create consequences.</p>
  <div class="startbox">
    <label>CADET / TEAM NAME<input id="player" placeholder="Enter name"></label>
    <label>PATH<select id="level"><option value="3">LET 3 • Team Leadership</option><option value="4">LET 4 • Senior Leadership</option></select></label>
    <button id="begin" type="button">ENTER DECISION LAB</button>
  </div>
</section>

<section id="game" class="screen">
  <div id="caseStrip" class="caseStrip"></div>
  <div class="tools">
    <button id="caseFileBtn" class="secondary" type="button">CASE FILE</button>
    <button id="decisionLogBtn" class="secondary" type="button">DECISION LOG</button>
  </div>
  <div id="drawer" class="drawer hidden"></div>
  <article class="card">
    <p id="caseLabel" class="eyebrow"></p>
    <h2 id="caseTitle"></h2>
    <p id="brief" class="brief"></p>
    <div id="task"></div>
    <div id="feedback"></div>
    <button id="hint" class="secondary" type="button">ANALYST HINT −125</button>
  </article>
</section>

<section id="finish" class="screen">
  <p class="eyebrow">AFTER-ACTION REVIEW</p>
  <h1>DECISION LAB COMPLETE</h1>
  <h2 id="finalWho"></h2>
  <div id="summary" class="summary"></div>
  <button type="button" onclick="location.reload()">RUN AGAIN</button>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
